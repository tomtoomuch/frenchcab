services:
  backend:
    #image: emfall/frenchcab-backend:latest
    build: ./backend
    container_name: conteneur-back
    ports:
      - "3001:3001"
    #volumes:
      #- ./backend:/app
      # Garantit que Docker synchronise correctement le dossier de la DB
      #- ./backend/data:/app/data  
    restart: always

  frontend:
    #image: emfall/frenchcab-frontend:latest
    build: ./frontend
    container_name: conteneur-front
    ports:
      - "4200:80"
    #volumes:
      #- ./frontend:/app
    depends_on:
      - backend
    restart: always

volumes:
  frontend:
  backend:
