services:
  backend:
    image: emfall/frenchcab-backend:latest
    container_name: conteneur-back
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    image: emfall/frenchcab-frontend:latest
    container_name: conteneur-front
    ports:
      - "4200:80"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    restart: always

volumes:
  frontend:
  backend: